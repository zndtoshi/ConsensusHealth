<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Consensus Health">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="diamond">
      <rect x="78" y="78" width="164" height="164" rx="22" transform="rotate(45 160 160)"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#nebula)"/>
  <circle cx="220" cy="420" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="340" cy="500" r="2" fill="#fca5a5" opacity="0.65"/>
  <circle cx="980" cy="180" r="2.5" fill="#86efac" opacity="0.7"/>
  <circle cx="1080" cy="390" r="2" fill="#e2e8f0" opacity="0.45"/>
  <circle cx="860" cy="520" r="1.8" fill="#93c5fd" opacity="0.55"/>
  <g transform="translate(120 155)">
    <g clip-path="url(#diamond)">
      <rect x="0" y="0" width="320" height="160" fill="#1AAA50"/>
      <rect x="0" y="155" width="320" height="165" fill="#E81E26"/>
      <rect x="0" y="0" width="160" height="320" fill="#000000" opacity="0.07"/>
      <rect x="160" y="0" width="160" height="320" fill="#FFFFFF" opacity="0.086"/>
    </g>
  </g>
  <text x="360" y="290" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Consensus Health</text>
  <text x="360" y="350" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28">BIP galaxies of public Bitcoin stances</text>
  <rect x="360" y="390" width="420" height="3" rx="2" fill="url(#accent)"/>
  <text x="360" y="440" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">consensus.health</text>
</svg>
